plugins {
    id 'java-library'
    id 'maven-publish'
}

group = providers.gradleProperty('group').get()
version = providers.gradleProperty('mod_version').get()

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = rootProject.group
    version = rootProject.version

    base {
        archivesName = "mineagentx-${project.name}"
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
    }

    dependencies {
        // NeoForge supplies Minecraft's Gson; the standalone API only needs
        // it at compile time. Shared game code is compiled by :neoforge.
        if (project.name != 'neoforge') {
            compileOnly 'com.google.code.gson:gson:2.11.0'
        }
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    // Preserve the exact upstream license in every binary distribution.
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) {
            into 'META-INF'
            rename { 'LICENSE_MineAgentX' }
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
