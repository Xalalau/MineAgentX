plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.131'
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = 'mineagentx-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

// Compile every shared module into the distributable mod. A normal Gradle
// project dependency is only present on the development classpath; it is not
// embedded in the mod JAR and previously left all API classes missing at
// runtime.
sourceSets {
    main {
        java {
            srcDir project(':api').file('src/main/java')
            srcDir project(':engine').file('src/main/java')
            // The complete visual client is loader-neutral vanilla code.
            // The standalone engine module does not compile the client UI.
            srcDir project(':engine').file('src/client/java')
            srcDir project(':tools').file('src/main/java')
        }
        resources {
            srcDir project(':engine').file('src/client/resources')
            srcDir project(':tools').file('src/main/resources')
        }
    }
}

dependencies {
    implementation project(':api')
}

neoForge {
    version = project.property('neoforge_version')

    // Apply the same mapped game and library dependencies to the migrated
    // plain JUnit regressions. They do not need to launch a Minecraft server.
    addModdingDependenciesTo sourceSets.test
    validateAccessTransformers = true

    // ModDev does not infer the active development mod merely from
    // neoforge.mods.toml. Without this declaration resources were visible in
    // the Mods list, but the class directory was not scanned as MineAgent:
    // @Mod, key mappings, commands, networking, and engine setup never ran.
    mods {
        mineagent {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

tasks.named('test', Test) {
    systemProperty 'mineagentx.projectRoot', rootProject.projectDir.absolutePath
    // These tests are CPU/local-filesystem regressions; no game launch, remote
    // model endpoint, or provider credentials are required.
    testLogging {
        events 'failed', 'skipped'
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_name', project.property('mod_name')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/neoforge.mods.toml') {
        // NeoForge ModDev does not expand arbitrary Gradle placeholders by
        // default; without this, the installed mod reports "${version}".
        expand version: project.version, mod_name: project.property('mod_name')
    }
}
