name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish NeoForge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check English text and capability inventory
        run: python scripts/check_project.py

      - name: Test and build NeoForge
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean :neoforge:test :neoforge:build

      - name: Verify regression tests ran and locate the release JAR
        id: verify
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('neoforge/build/test-results/test').glob('TEST-*.xml'))
          assert reports, 'No JUnit reports: regression tests did not run'
          assert sum(int(ET.parse(path).getroot().attrib['tests']) for path in reports) > 0
          jars = [jar for jar in Path('neoforge/build/libs').glob('mineagentx-neoforge-*.jar')
                  if not jar.name.endswith('-sources.jar')]
          assert len(jars) == 1, f'Expected one release JAR, found {jars}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'jar={jars[0]}\n')
          PY

      - name: Create prerelease with NeoForge JAR
        env:
          GH_TOKEN: ${{ github.token }}
          NEOFORGE_JAR: ${{ steps.verify.outputs.jar }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$NEOFORGE_JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MineAgentX $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
