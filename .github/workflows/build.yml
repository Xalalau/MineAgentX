name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Java 21 / NeoForge / Minecraft 1.21.1
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check English text and capability inventory
        run: python scripts/check_project.py

      - name: Test and build NeoForge
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :neoforge:test :neoforge:build

      - name: Verify regression tests ran and the release JAR exists
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('neoforge/build/test-results/test').glob('TEST-*.xml'))
          assert reports, 'No JUnit reports: regression tests did not run'
          suites = [ET.parse(path).getroot() for path in reports]
          assert sum(int(suite.attrib['tests']) for suite in suites) > 0
          jars = list(Path('neoforge/build/libs').glob('mineagentx-neoforge-*.jar'))
          assert any(not jar.name.endswith('-sources.jar') for jar in jars), 'No release JAR'
          PY

      - name: Upload NeoForge artifact
        uses: actions/upload-artifact@v4
        with:
          name: mineagentx-neoforge
          path: neoforge/build/libs/mineagentx-neoforge-*.jar
          if-no-files-found: error

      - name: Upload regression test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineagentx-test-reports
          path: neoforge/build/reports/tests/test/
          if-no-files-found: error
